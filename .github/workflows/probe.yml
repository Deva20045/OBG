name: probe
on:
  push:
    branches: [arena/01a0a306-obg]
jobs:
  p:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: probe write
        run: |
          git config user.email "bot@example.com"
          git config user.name "probe"
          git checkout -b arena/obg-probe-${{ github.run_number }}
          date -u > PROBE.txt
          git add PROBE.txt && git commit -m probe && git push origin HEAD
