<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PULSE OBG</title><style>body{margin:0;background:#110d18;color:#f7f1fb;font:16px system-ui}main{max-width:980px;margin:auto;padding:32px}h1{color:#ff7d9d}section,.card{background:#21182d;border:1px solid #49365c;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.chapter{padding:16px;border-radius:12px;background:#2a2037}.live{border-color:#ff7d9d}.muted{color:#b7a8c4}button{background:#ff7d9d;border:0;border-radius:10px;padding:12px 16px;font-weight:700;color:#241323;cursor:pointer}label{display:block;background:#332541;margin:8px 0;padding:12px;border-radius:9px;cursor:pointer}</style></head><body><main><h1>PULSE OBG</h1><p class="muted">Obstetrics & Gynaecology · line-by-line book companion</p><section><h2>Chapters</h2><div id="chapters" class="grid"></div></section><section id="lesson"><h2>Chapter 1 · Foundations</h2><p class="muted">Strict source order · Unit 1</p><div id="quiz"></div></section></main><script>
const QUESTIONS=[
